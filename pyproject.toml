[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nuclear-glass-corrosion"
version = "0.2.0"
description = "Glass dissolution physics, physics-informed neural operators and conformal prediction for long-term nuclear waste glass corrosion"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "omegaconf>=2.3.0",
    "rich>=13.0.0",
]

# The neural models (PINO, DeepONet, Bayesian NN) and their training loop need
# PyTorch: pip install -r requirements-ml.txt. The physics, conformal
# prediction, data and evaluation modules and the app do not.

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.3.0",
]
app = ["streamlit>=1.37"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nuclear_glass*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20", "PTH", "ERA"]
ignore = ["E501", "B008"]

[tool.mypy]
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
